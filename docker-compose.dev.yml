version: "3.9"

services:
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-code-review-api-dev
    # Debugger + uvicorn with reload
    command: >
      uv run python -m debugpy
      --listen 0.0.0.0:5678
      --wait-for-client
      -m uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    env_file:
      - .env
    environment:
      APP_ENV: "dev"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LLM_API_BASE: http://llm:8001
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app"
    working_dir: /app
    volumes:
      - .:/app:cached        # mount source code
      - uv_cache:/root/.cache/uv
    ports:
      - "8000:8000"          # FastAPI
      - "5678:5678"          # debugpy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-code-review-worker-dev
    # Optional debugger for worker; comment out debugpy if not needed
    command: >
      uv run python -m debugpy
      --listen 0.0.0.0:5679
      --wait-for-client
      -m celery
      -A app.workers.celery_app.celery_app worker
      --loglevel=INFO
    env_file:
      - .env
    environment:
      APP_ENV: "dev"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LLM_API_BASE: http://llm:8001
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app"
    working_dir: /app
    volumes:
      - .:/app:cached
      - uv_cache:/root/.cache/uv
    ports:
      - "5679:5679"          # debugpy for worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ai-code-review-postgres-dev
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_code_review}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-code-review-redis-dev
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: ai-code-review-qdrant-dev
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Optional: local LLM in dev
  # llm:
  #   image: your-llm-image:latest
  #   container_name: ai-code-review-llm-dev
  #   ports:
  #     - "8001:8001"
  #   environment:
  #     # model-specific envs
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  uv_cache:

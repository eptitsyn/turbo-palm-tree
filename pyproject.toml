[project]
name = "ai-code-review"
version = "0.1.0"
description = "Offline AI-powered code review system for GitLab using FastAPI, Celery, crewAI, SQLAlchemy, Alembic."
authors = [{ name = "Evgenii Ptitsyn", email = "eptitsyn@gmail.com" }]
license = "AGPL-3.0-or-later"
requires-python = ">=3.10,<3.14"

dependencies = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",

    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",

    # Celery
    "celery>=5.3",
    "redis>=5.0",

    # HTTP clients
    "httpx>=0.27",
    "requests>=2.32",

    # crewAI
    "crewai>=0.35",
    "crewai-tools>=0.1",

    # LLM — OpenAI compatible client (works with local vLLM/llama.cpp servers)
    "openai>=1.30",

    # LangChain (optional but useful)
    "langchain>=0.2",
    "langchain-community>=0.2",
    "langchain-core>=0.2",

    # Utilities
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "loguru>=0.7",
    "json-repair>=0.54.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "isort>=5.13",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
pythonpath = ["app"]

# ------ mypy ------
[tool.mypy]
python_version = "3.11"

# Tell mypy where your code package lives
packages = ["app"]
explicit_package_bases = true

# How strict?
# This is "medium strict": catches real bugs but doesn't make you suffer.
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true

no_implicit_optional = true

# Don't force annotations everywhere yet (good for a growing project).
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

# External libs: be pragmatic.
# If some third-party libs don't ship stubs, we don't want CI red all the time.
ignore_missing_imports = true

# Misc quality-of-life
pretty = true
show_error_codes = true
show_column_numbers = true

# ---------------------------------------------------------------------
# Plugin: Pydantic (v1/v2) – helps with BaseModel / BaseSettings typing
# ---------------------------------------------------------------------
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-code-review-api
    command: >
      uv run uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    env_file:
      - .env
    environment:
      # Override or complement .env as needed
      APP_ENV: "docker"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      # Example LLM endpoint inside private contour
      LLM_API_BASE: http://llm:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-code-review-worker
    command: >
      uv run celery
      -A app.workers.celery_app.celery_app worker
      --loglevel=INFO
    env_file:
      - .env
    environment:
      APP_ENV: "docker"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      LLM_API_BASE: http://llm:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ai-code-review-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_code_review}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-code-review-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: ai-code-review-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Example placeholder for local LLM server (vLLM / TGI / llama.cpp HTTP wrapper)
  # llm:
  #   image: your-llm-image:latest
  #   container_name: ai-code-review-llm
  #   ports:
  #     - "8001:8001"
  #   environment:
  #     # Whatever your LLM backend needs
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

# ruff.toml
# ============================================================
# Ruff configuration for AI Code Review project
# Fast, strict-ish, but pragmatic for real-world backend code.
# ============================================================

# Use same max line length as Black/isort/EditorConfig
line-length = 100

# Target Python version
target-version = "py310"

# Where your code lives (affects some rules, import sorting, etc.)
src = ["app", "tests"]

# ============================================================
# Lint configuration
# ============================================================
[lint]
# Enable a broad but reasonable set of rules:
# - E, W    : pycodestyle
# - F       : pyflakes
# - I       : isort
# - B       : flake8-bugbear
# - UP      : pyupgrade
# - C4      : flake8-comprehensions
# - TID     : flake8-tidy-imports
# - SIM     : flake8-simplify
# - RET     : flake8-return
# - PL      : pylint-inspired checks
# - N       : pep8-naming
# - S       : flake8-bandit (security-ish checks)
# - RUF     : Ruff-specific rules
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "TID",
    "SIM",
    "RET",
    "PL",
    "N",
    "S",
    "RUF",
]

# Ignore some noisy / style-duplicated rules:
ignore = [
    "E203",    # whitespace before ':' (Black-compatible)
    "E501",    # line length (handled by Black)
    "B008",    # function call in default argument (often OK with Pydantic/Depends)
    "B905",    # zip() without strict= (too noisy)
    "PLR0913", # too many arguments in function definition
    "PLR0915", # too many statements
    "PLR2004", # magic value in comparison
]

# Treat these as "fixable" by `ruff --fix`
fixable = ["ALL"]
unfixable = []

# Show full paths in output
show-fixes = true

# ============================================================
# Per-file ignores
# ============================================================
[lint.per-file-ignores]
# Tests: allow prints, asserts, and sometimes more flexible names
"tests/**/*.py" = [
    "S101",    # use of assert
    "S105",    # hard-coded passwords (often false-positive in tests)
    "PLR2004", # magic numbers
]

# Alembic migrations: allow a lot of stuff (autogenerated, dynamic)
"alembic/versions/*.py" = [
    "E501",
    "F401",
    "F403",
    "F405",
    "B008",
    "S101",
    "RUF001",
    "RUF002",
    "RUF003",
]

# Entry points / scripts may use prints
"app/main.py" = [
    "T201",    # print in code
]

# ============================================================
# isort-style import sorting (handled by Ruff)
# ============================================================
[lint.isort]
known-first-party = ["app", "tests"]
force-single-line = false
combine-as-imports = true
lines-after-imports = 2

# ============================================================
# Naming
# ============================================================
[lint.pep8-naming]
# Allow typical pytest fixtures and FastAPI/Celery naming style
ignore-names = [
    "db",
    "client",
    "app",
    "engine",
    "SessionTesting",
]

# ============================================================
# Flake8-tidy-imports
# ============================================================
[lint.flake8-tidy-imports]
# Disallow "import *"
ban-relative-imports = "parents"

# ============================================================
# Security (flake8-bandit subset via S codes)
# ============================================================
[lint.flake8-bandit]
# In a private contour some checks may be a bit noisy, but it's good to keep them.
# You can tune here later if Bandit warnings are too strict.
